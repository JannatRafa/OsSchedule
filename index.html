<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Scheduling Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
                    },
                },
            },
        };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { transition: background-color 0.2s ease, color 0.2s ease; }
        .gantt-bar { transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), filter 0.15s ease; }
        .gantt-bar:hover { transform: translateY(-2px); filter: brightness(1.08); }
        .cursor-timeline { transition: left 0.18s cubic-bezier(0.2, 0, 0, 1); }
        @keyframes viewFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .view-enter { animation: viewFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both; }
        @keyframes rowFadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .row-enter { animation: rowFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .row-exit { transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; transform: translateX(16px); }
        .btn-tactile { transition: transform 0.12s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.15s ease; }
        .btn-tactile:active { transform: scale(0.96); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body class="h-full bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased">
    <div id="app" class="min-h-full flex flex-col"></div>
    <script type="module" src="./js/app.js"></script>
</body>
</html>
